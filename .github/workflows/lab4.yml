name: Lab 4 CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  c-build-test:
    name: Lab 4 C checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build program and tests
        working-directory: lab3
        run: |
          make clean
          make

      - name: Run program and verify output
        working-directory: lab3
        shell: bash
        run: |
          output="$(./fibonacci_program)"
          echo "$output"

          grep -Fq "55" <<< "$output"
          grep -Fq "1.618034" <<< "$output"

          echo "Verified Fibonacci output: 55"
          echo "Verified golden ratio output: 1.618034"
      - name: Run all unit tests
        working-directory: lab3
        run: make test

      - name: Clean build files
        working-directory: lab3
        run: make clean

  semgrep:
    name: Semgrep Community Edition
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Semgrep Community Edition
        run: pipx install semgrep

      - name: Run Semgrep scan
        run: semgrep scan --config auto .
